version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_app
    ports:
      - "8000:8000"
    volumes:
      - ./app:/src/app
    environment:
      - ENV=Desenvolvimento
      - PORT=8000
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
